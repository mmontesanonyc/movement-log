<!DOCTYPE html>
<html>
  <head>
    <!--
    Other ideas:
      Click to show a day's details.
      Add scheduled / done color indicators.
      Click to show a week's summary.

      Create conditional styling for 
        Biking:       <i class="fas fa-bicycle"></i>
        Gym:          <i class="fas fa-dumbbell"></i>
        Gen'l active: <i class="fas fa-walking"></i>
        (get FontAwesome 5)

      Break up Item.Notes so that you can calculate off of it
      Save everything to one big data object? 

  -->

    <!-- Bootstrap 4.1 -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    />

    <!-- Fontawesome 5.9.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css"
      integrity="sha512-q3eWabyZPc1XTCmF+8/LuE1ozpg5xxn7iO89yfSOd5/oKvyqLngoNGsx8jq92Y8eXJ/IRxQbEC+FGSYxtk2oiw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border: 1px solid #ccc;
      }

      .calendar-header,
      .calendar-day {
        border: 1px solid #ddd;
        padding: 6px;
      }

      .calendar-header {
        font-weight: bold;
        text-align: center;
        background: #f8f9fa;
      }

      .date-number {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .activity {
        font-size: 0.85em;
        margin-bottom: 4px;
        padding: 8px;
        background: #e9f2ff;
        border-radius: 3px;
      }

      .activity.done {
        background: #d4edda; /* Bootstrap green */
        border-left: 4px solid #28a745;
      }

      .activity.missed {
        background: #f8d7da; /* Bootstrap red/pink */
        border-left: 4px solid #dc3545;
      }

      .activity.rest {
        background: #d4edda75; /* Bootstrap green */
      }

      hr {
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <body class="p-3">
      <h3>Activity Calendar</h3>
      <p><strong>Goals</strong> for winter
      <ul>
        <li>2x/week strength: Gym and core-home-weight </li>
        <li>2x/week indoor riding</li>
      </ul></p>
      <p><strong>Spring:</strong> Consider shifting to a Worth Street commute day. Continue gym and ramp up home/weight. <a href="https://t-nation.com/t/5-3-1-how-to-build-pure-strength/281694">Consider 5/3/1</a>. Consider adding a daily practice. Consider weekend aerobic.</p>
      <div id="calendar"></div>
    </body>

    <script>
      // SET FILE URL
      const trackerURL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTBUFreWSuNQf5WjF3kZuS4kViTkppPcPgk3a1yOwXJJGcozdl8r2-aEDy7Ev10YoQsOb47dszCYTpl/pub?gid=0&single=true&output=csv";

      fetch(trackerURL)
        .then((r) => r.text())
        .then((csv) => {
          const rows = parseCSV(csv);
          console.log("Parsed rows:", rows);
          buildCalendar(rows);
        });

      // --------------------
      // REAL CSV PARSER (handles quotes & commas)
      // --------------------
      function parseCSV(csv) {
        const rows = [];
        let current = [];
        let value = "";
        let insideQuotes = false;

        for (let i = 0; i < csv.length; i++) {
          const c = csv[i];

          if (c === '"') {
            insideQuotes = !insideQuotes;
          } else if (c === "," && !insideQuotes) {
            current.push(value);
            value = "";
          } else if ((c === "\n" || c === "\r") && !insideQuotes) {
            if (value || current.length) {
              current.push(value);
              rows.push(current);
            }
            current = [];
            value = "";
          } else {
            value += c;
          }
        }

        if (value || current.length) {
          current.push(value);
          rows.push(current);
        }

        const headers = rows[0];

        return rows
          .slice(1)
          .filter((r) => r.length === headers.length)
          .map((r) => {
            const obj = {};
            headers.forEach((h, i) => {
              obj[h.trim()] = r[i].trim();
            });
            return obj;
          });
      }

      // --------------------
      // DATE HELPERS (M/D/YY)
      // --------------------
      function parseUSDate(s) {
        if (!s) return NaN;

        const [m, d, y] = s.split("/");
        if (!m || !d || !y) return NaN;

        const year = y.length === 2 ? Number("20" + y) : Number(y);
        return new Date(year, Number(m) - 1, Number(d));
      }

      function toISODate(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }

      // --------------------
      // GROUP BY DATE
      // --------------------
      function groupByDate(rows) {
        const map = {};

        rows.forEach((r) => {
          const d = parseUSDate(r.Date);
          if (isNaN(d)) return;

          const iso = toISODate(d);
          if (!map[iso]) map[iso] = [];
          map[iso].push(r);
        });

        return map;
      }

      // --------------------
      // DATE RANGE
      // --------------------
      function getDateRange(rows) {
        const dates = rows
          .map((r) => parseUSDate(r.Date))
          .filter((d) => !isNaN(d));

        if (!dates.length) return null;

        const min = new Date(Math.min(...dates));
        const max = new Date(Math.max(...dates));

        // Monday-based index (Mon = 0, Sun = 6)
        const minOffset = (min.getDay() + 6) % 7;
        const maxOffset = (max.getDay() + 6) % 7;

        // move min back to Monday
        min.setDate(min.getDate() - minOffset);

        // move max forward to Sunday
        max.setDate(max.getDate() + (6 - maxOffset));

        return { min, max };
      }

      // --------------------
      // BUILD CALENDAR
      // --------------------
      function buildCalendar(rows) {
        const calendar = document.getElementById("calendar");
        const grouped = groupByDate(rows);
        const range = getDateRange(rows);

        if (!range) {
          calendar.innerHTML = "No valid dates";
          return;
        }

        const { min, max } = range;

        calendar.innerHTML = "";
        calendar.className = "calendar";

        ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach((d) => {
          const h = document.createElement("div");
          h.className = "calendar-header";
          h.textContent = d;
          calendar.appendChild(h);
        });

        let d = new Date(min);
        while (d <= max) {
          const dayDiv = document.createElement("div");
          dayDiv.className = "calendar-day";

          const iso = toISODate(d);

          const num = document.createElement("div");
          num.className = "date-number";
          num.textContent = d.getDate();
          dayDiv.appendChild(num);

          if (grouped[iso]) {
            grouped[iso].forEach((item) => {
              const a = document.createElement("div");

              let activityClass = "activity";
              if (item.Done) {
                const doneValue = item.Done.toLowerCase();
                if (doneValue === "yes" && item.Activity != "Rest")
                  activityClass += " done";
                else if (doneValue === "no") activityClass += " missed";
                else if (doneValue === "yes" && item.Activity === "Rest")
                  activityClass += " rest";
              }

              a.className = activityClass;

              const icon = item.Activity.includes("Ride")
                ? '<i class="fas fa-biking"></i> '
                : item.Activity === "Gym"
                ? '<i class="fas fa-dumbbell"></i> '
                : item.Activity === "Core/weight"
                ? '<i class="fas fa-universal-access"></i> '
                : item.Activity === "Other"
                ? '<i class="fas fa-walking"></i>'
                : "";

              const notes = (item.Notes || "")
                .replace(/;\s*/g, "<br>") // line breaks
                .replace(/\|/g, ": "); // key/value separator

              a.innerHTML = `
          <strong>${icon}${item.Activity}</strong>

          ${item.Time ? `<hr>${item.Time}` : ""}

          ${notes ? `<hr>${notes}` : ""}
        `;

              dayDiv.appendChild(a);
            });
          }

          calendar.appendChild(dayDiv);
          d.setDate(d.getDate() + 1);
        }
      }
    </script>
  </body>
</html>
