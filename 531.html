<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5/3/1 Helper</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body class="bg-base-200">
<main class="h-dvh max-w-md mx-auto flex flex-col gap-3 p-3 pt-[max(0.75rem,env(safe-area-inset-top))] pb-[max(0.75rem,env(safe-area-inset-bottom))]">

  <h1 class="text-xl font-bold tracking-tight text-center">5/3/1 <span class="text-primary">Helper</span></h1>

  <!-- 3RM inputs: tap a row to select the lift -->
  <section class="card bg-base-100 shadow">
    <div id="lift-rows" class="card-body p-2 gap-1">
      <div data-l="s" class="lift-row flex items-center justify-between gap-3 rounded-box border-2 border-transparent px-2 py-1.5 cursor-pointer">
        <span class="font-semibold">Squat</span>
        <input id="in-s" type="number" inputmode="decimal" step="2.5" min="0" placeholder="3RM" class="input input-bordered input-sm w-28 text-right text-base font-semibold">
      </div>
      <div data-l="b" class="lift-row flex items-center justify-between gap-3 rounded-box border-2 border-transparent px-2 py-1.5 cursor-pointer">
        <span class="font-semibold">Bench</span>
        <input id="in-b" type="number" inputmode="decimal" step="2.5" min="0" placeholder="3RM" class="input input-bordered input-sm w-28 text-right text-base font-semibold">
      </div>
      <div data-l="d" class="lift-row flex items-center justify-between gap-3 rounded-box border-2 border-transparent px-2 py-1.5 cursor-pointer">
        <span class="font-semibold">Deadlift</span>
        <input id="in-d" type="number" inputmode="decimal" step="2.5" min="0" placeholder="3RM" class="input input-bordered input-sm w-28 text-right text-base font-semibold">
      </div>
    </div>
  </section>

  <!-- Week stepper + lift selector -->
  <section class="flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <button id="prev" class="btn btn-circle btn-ghost" aria-label="Previous week">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="text-center leading-tight">
        <div id="week-title" class="text-xl font-bold"></div>
        <div id="week-sub" class="text-xs opacity-60"></div>
      </div>
      <button id="next" class="btn btn-circle btn-ghost" aria-label="Next week">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- Sets -->
  <section class="card bg-base-100 shadow flex-1 min-h-0">
    <div class="card-body p-3 gap-2 min-h-0">
      <h2 id="title" class="font-bold text-lg"></h2>
      <div id="sets" class="flex-1 min-h-0 flex flex-col gap-2"></div>
      <p class="text-[11px] opacity-50 text-center">Rounded to nearest 2.5 · + = as many reps as possible</p>
    </div>
  </section>

</main>

<script>
const WEEKS = {
  1: { sub: "5s",     sets: [[65, "5"],  [75, "5"],  [85, "5+"]] },
  2: { sub: "3s",     sets: [[70, "3"],  [80, "3"],  [90, "3+"]] },
  3: { sub: "5/3/1",  sets: [[75, "5"],  [85, "3"],  [95, "1+"]] },
  4: { sub: "Deload", sets: [[40, "5"],  [50, "5"],  [60, "5"]] },
};
const LIFTS = { s: "Squat", b: "Bench", d: "Deadlift" };
const ROUND = 2.5;

const state = { s: "", b: "", d: "", w: 1, l: "s" };

// ---- URL / storage <-> state ----
const KEYS = ["s", "b", "d", "w", "l"];
const STORE = "531-state";
const hasKeys = (p) => KEYS.some((k) => p.has(k));

function applyParams(p) {
  for (const k of ["s", "b", "d"]) {
    const v = parseFloat(p.get(k));
    if (isFinite(v) && v > 0) state[k] = v;
  }
  const w = parseInt(p.get("w"));
  if (WEEKS[w]) state.w = w;
  const l = p.get("l");
  if (LIFTS[l]) state.l = l;
}

// Priority: ?query -> legacy #hash -> last saved in localStorage
function loadState() {
  const q = new URLSearchParams(location.search);
  if (hasKeys(q)) return applyParams(q);
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (hasKeys(h)) return applyParams(h);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) applyParams(new URLSearchParams(saved));
  } catch (e) {}
}

function saveState() {
  const p = new URLSearchParams();
  for (const k of ["s", "b", "d"]) if (state[k] !== "") p.set(k, state[k]);
  p.set("w", state.w);
  p.set("l", state.l);
  const qs = p.toString();
  try { history.replaceState(null, "", location.pathname + "?" + qs); } catch (e) {}
  try { localStorage.setItem(STORE, qs); } catch (e) {}
}

// ---- Render ----
const $ = (id) => document.getElementById(id);
const roundTo = (x) => Math.round(x / ROUND) * ROUND;
const fmt = (n) => (Number.isInteger(n) ? n : n.toFixed(1));

function render() {
  for (const k of ["s", "b", "d"]) {
    const el = $("in-" + k);
    if (document.activeElement !== el) el.value = state[k];
  }

  document.querySelectorAll(".lift-row").forEach((r) => {
    const on = r.dataset.l === state.l;
    r.classList.toggle("border-primary", on);
    r.classList.toggle("bg-primary/10", on);
    r.classList.toggle("border-transparent", !on);
  });

  const week = WEEKS[state.w];
  const tm = state[state.l];
  $("week-title").textContent = "Week " + state.w;
  $("week-sub").textContent = week.sub;
  $("title").textContent = LIFTS[state.l];

  $("sets").innerHTML = week.sets.map(([pct, reps], i) => {
    const weight = tm === "" ? "—" : fmt(roundTo(tm * pct / 100));
    return `
      <div class="flex-1 min-h-0 flex items-center justify-between rounded-box bg-base-200 px-4">
        <div class="flex flex-col">
          <span class="text-xs opacity-60">Set ${i + 1}</span>
          <span class="text-sm font-semibold">${reps} × ${pct}%</span>
        </div>
        <div class="text-4xl font-extrabold tabular-nums">${weight}</div>
      </div>`;
  }).join("");
}

// ---- Events ----
for (const k of ["s", "b", "d"]) {
  $("in-" + k).addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    state[k] = isFinite(v) && v > 0 ? v : "";
    saveState();
    render();
  });
}
const step = (d) => { state.w = ((state.w - 1 + d + 4) % 4) + 1; saveState(); render(); };
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
const selectLift = (e) => {
  const r = e.target.closest("[data-l]");
  if (!r || r.dataset.l === state.l) return;
  state.l = r.dataset.l;
  saveState(); render();
};
$("lift-rows").addEventListener("click", selectLift);
$("lift-rows").addEventListener("focusin", selectLift);

loadState();
saveState();
render();
</script>
</body>
</html>
